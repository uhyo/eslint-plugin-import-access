name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          # The devDependency ESLint (v10+) only supports flat config
          TEST_FLAT_CONFIG: "true"
      - name: Publish to npm (pre-release beta)
        if: ${{ github.event.release.prerelease }}
        run: npm publish --tag beta

      - name: Publish to npm (release latest)
        if: ${{ github.event.release.prerelease == false }}
        run: npm publish
